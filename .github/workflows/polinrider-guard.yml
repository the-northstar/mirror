name: PolinRider Guard
# Server-side malware tripwire. Runs on every push to every branch — an infected
# developer machine CANNOT disable or skip this (it runs on GitHub, not locally).
# On detecting the PolinRider payload it FAILS the run, and (on a branch it can
# write) auto-reverts the push to the last clean commit, then opens an issue.
#
# Free-tier: GitHub Actions runs on private repos at no cost within the monthly
# minutes budget; a scan job is a few seconds.

on:
  push:
    branches: ['**']
    # Cost optimization: only scan pushes that touch files the payload can live in
    # (config files + font-disguised payloads + any source). Doc/image-only pushes
    # skip the guard entirely, saving Actions minutes with no loss of coverage —
    # the payload only ever lands in these file types.
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/*.json'
      - '**/*.woff2'
      - '**/*.woff'
      - '**/*.ttf'
      - '**/*.eot'
      - '**/.vscode/**'

permissions:
  contents: write   # to auto-revert
  issues: write     # to alert

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Scan for PolinRider payload
        id: scan
        shell: bash
        run: |
          # Scanner is shared with guard/scan.sh in the-northstar/.github (keep in sync).
          cat > "$RUNNER_TEMP/scan.sh" <<'SCAN'
          #!/usr/bin/env bash
          # PolinRider scanner. Run inside a checkout; prints hits, exit 1 if any.
          # NOTE: this exact script is ALSO embedded in guard/polinrider-guard.yml (each repo's
          # workflow must be self-contained). Keep the two in sync.
          set -uo pipefail
          PATTERNS='global\.i\s*=|global\['"'"'_V'"'"'\]|global\['"'"'r'"'"'\]=require|RPC_ENDPOINTS|/0x/clb|verify-human|166\.88\.'
          OBF='_0x[0-9a-f]{4,}|require\(|eval\(|spawn|global\[|fromCharCode|atob\(|\(function|\)\(\)|while\(!!\[\]\)|parseInt\('
          skip(){ case "$1" in */dist/*|dist/*|*/build/*|build/*|*/node_modules/*|node_modules/*|*.min.js|*.bundle.js|*lock.json|*.lock) return 0;; esac; return 1; }
          hit=""
          # 1) marker strings in source/config/font files
          while IFS= read -r f; do
            [ -f "$f" ] || continue; skip "$f" && continue
            LC_ALL=C grep -Eq "$PATTERNS" "$f" 2>/dev/null && hit="$hit$f (marker)"$'\n'
          done < <(git ls-files -- '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.jsx' '*.json' '*.woff2' '*.woff' '*.ttf' '*.eot' '.vscode/*')
          # 2) obfuscated-identifier style (_0xabcd=) in hand-written source only
          while IFS= read -r f; do
            [ -f "$f" ] || continue; skip "$f" && continue
            LC_ALL=C grep -Eq '_0x[0-9a-f]{4,}[[:space:]]*=' "$f" 2>/dev/null && hit="$hit$f (obfuscated-ids)"$'\n'
          done < <(git ls-files -- '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.jsx')
          # 3) payload appended behind whitespace: a >1000-char line that also carries an obfuscation hallmark
          while IFS= read -r f; do
            [ -f "$f" ] || continue; skip "$f" && continue
            awk 'NR>1 && length($0)>1000' "$f" 2>/dev/null | LC_ALL=C grep -qE "$OBF" && hit="$hit$f (appended-obfuscated)"$'\n'
          done < <(git ls-files -- '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.jsx' '*.json' '.vscode/*')
          # 4) files that claim to be fonts but are not (payload disguised as a web font)
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            m4=$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n'); ok=0
            case "$f" in
              *.woff)  [ "$m4" = 774f4646 ] && ok=1;;
              *.woff2) [ "$m4" = 774f4632 ] && ok=1;;
              *.ttf)   { [ "$m4" = 00010000 ] || [ "$m4" = 74727565 ] || [ "$m4" = 4f54544f ]; } && ok=1;;
              *.eot)   [ "$(dd if="$f" bs=1 skip=34 count=2 2>/dev/null | od -An -tx1 | tr -d ' \n')" = 4c50 ] && ok=1;;
            esac
            [ $ok = 1 ] || hit="$hit$f (fake-font)"$'\n'
          done < <(git ls-files -- '*.woff' '*.woff2' '*.ttf' '*.eot')
          if [ -n "$hit" ]; then echo "PAYLOAD DETECTED in:"; printf '%s' "$hit"; exit 1; fi
          echo clean
          SCAN
          if out=$(bash "$RUNNER_TEMP/scan.sh"); then
            echo "$out"; echo "detected=0" >> "$GITHUB_OUTPUT"
          else
            echo "$out"; echo "detected=1" >> "$GITHUB_OUTPUT"
            { echo "files<<EOF"; echo "$out" | tail -n +2; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-revert the infected push
        if: steps.scan.outputs.detected == '1'
        id: revert
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          # Reset the branch via the API (works after a FORCE-push — a shallow checkout
          # never has the old tip, so `git push $parent:branch` dies with "bad object";
          # that is exactly how the 2026-08-29 wave survived). New branch => delete it.
          # Then WALK BACK: if the pre-push tip is itself infected (double push, or a
          # branch that was already dirty) keep stepping to the parent until clean.
          repo="${{ github.repository }}"; ref="${{ github.ref_name }}"; sha="${{ github.event.before }}"
          if [ "$sha" = "0000000000000000000000000000000000000000" ]; then
            gh api -X DELETE "repos/$repo/git/refs/heads/$ref" && { echo "reverted=deleted" >> "$GITHUB_OUTPUT"; exit 0; }
          else
            for i in $(seq 1 30); do
              git fetch -q --depth 2 origin "$sha" 2>/dev/null || break
              git checkout -q --force "$sha" 2>/dev/null || break
              if bash "$RUNNER_TEMP/scan.sh" >/dev/null; then
                gh api -X PATCH "repos/$repo/git/refs/heads/$ref" -f sha="$sha" -F force=true >/dev/null \
                  && { echo "reverted to ${sha:0:8} (walked back $((i-1)))"; echo "reverted=1" >> "$GITHUB_OUTPUT"; exit 0; }
                break
              fi
              echo "${sha:0:8} also infected — walking back"
              sha=$(git rev-parse -q --verify "$sha^" 2>/dev/null) || break
            done
          fi
          echo "::error::REVERT FAILED — payload is STILL on $ref"
          echo "reverted=0" >> "$GITHUB_OUTPUT"

      - name: Open alert issue
        if: steps.scan.outputs.detected == '1'
        uses: actions/github-script@v7
        env:
          FILES: ${{ steps.scan.outputs.files }}
          REVERTED: ${{ steps.revert.outputs.reverted }}
        with:
          script: |
            const files = process.env.FILES || '';
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `🚨 PolinRider payload blocked on push by ${context.actor}`,
              body: `The PolinRider malware was detected in a push by **${context.actor}** `
                  + `to \`${context.ref}\` (commit ${context.sha.slice(0,8)}) ` + (process.env.REVERTED === '1' ? 'and auto-reverted.' : process.env.REVERTED === 'deleted' ? 'and the new branch was deleted.' : '**and the REVERT FAILED — the payload is STILL on the branch. Reset it manually NOW.**') + `\n\n`
                  + `**Infected files:**\n\`\`\`\n${files}\n\`\`\`\n\n`
                  + `**Action required:** ${context.actor}'s machine is infected — disinfect it `
                  + `before pushing again, or every push will keep being reverted.`,
              labels: ['security','polinrider'],
            });

      # Instead of pinging Discord per-repo (a 70-repo burst = 70 pings), record the
      # detection to the central tracking issue and fire the aggregator, which
      # debounces 5 min and sends ONE batched alert + DMs. Uses the cross-repo token.
      - name: Record detection + trigger aggregator
        if: steps.scan.outputs.detected == '1'
        uses: actions/github-script@v7
        env:
          ENFORCER_TOKEN: ${{ secrets.ENFORCER_TOKEN }}
          TRACKING_ISSUE: ${{ secrets.TRACKING_ISSUE }}
        with:
          github-token: ${{ secrets.ENFORCER_TOKEN }}
          script: |
            const org = context.repo.owner;
            const event = {
              repo: context.repo.repo, actor: context.actor,
              sha: context.sha.slice(0,8), ref: context.ref,
              ts: new Date().toISOString(),
            };
            const issue = Number(process.env.TRACKING_ISSUE);
            if (issue) {
              try {
                await github.rest.issues.createComment({
                  owner: org, repo: '.github', issue_number: issue,
                  body: JSON.stringify(event),
                });
              } catch (e) { core.warning('log comment failed: ' + e); }
            }
            try {
              await github.rest.repos.createDispatchEvent({
                owner: org, repo: '.github',
                event_type: 'malware-detected', client_payload: event,
              });
            } catch (e) { core.warning('dispatch failed: ' + e); }

      - name: Fail the run if payload found
        if: steps.scan.outputs.detected == '1'
        run: |
          echo "::error::PolinRider payload detected. push=reverted / PR=blocked. See issue + Discord."
          exit 1
