name: PolinRider Guard
# Server-side malware tripwire. Runs on every push to every branch — an infected
# developer machine CANNOT disable or skip this (it runs on GitHub, not locally).
# On detecting the PolinRider payload it FAILS the run, and (on a branch it can
# write) auto-reverts the push to the last clean commit, then opens an issue.
#
# Free-tier: GitHub Actions runs on private repos at no cost within the monthly
# minutes budget; a scan job is a few seconds.

on:
  push:
    branches: ['**']
    # Cost optimization: only scan pushes that touch files the payload can live in
    # (config files + font-disguised payloads + any source). Doc/image-only pushes
    # skip the guard entirely, saving Actions minutes with no loss of coverage —
    # the payload only ever lands in these file types.
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.json'
      - '**/*.woff2'
      - '**/*.woff'
      - '**/*.ttf'
      - '**/*.eot'
      - '**/.vscode/**'

permissions:
  contents: write   # to auto-revert
  issues: write     # to alert

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # need parent to revert to
          persist-credentials: true

      - name: Scan for PolinRider payload
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          # Signatures common to every observed variant (config-file + fake-font).
          # We scan tracked text/config/font files for the loader markers and for
          # the tell-tale ultra-long minified line.
          PATTERNS='global\.i\s*=|global\['"'"'_V'"'"'\]|global\['"'"'r'"'"'\]=require|RPC_ENDPOINTS|/0x/clb|verify-human|166\.88\.'
          hit=""
          # 1) marker scan across source + config + fake-font extensions
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if LC_ALL=C grep -Eq "$PATTERNS" "$f" 2>/dev/null; then hit="$hit$f"$'\n'; fi
          done < <(git ls-files -- '*.js' '*.mjs' '*.cjs' '*.ts' '*.json' '*.woff2' '*.woff' '*.ttf' '*.eot')
          # 2) giant-line scan on config files (payload appended behind whitespace)
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if awk 'length($0)>1000{found=1} END{exit !found}' "$f" 2>/dev/null; then
              # only flag config-shaped files, real minified bundles live in dist/
              case "$f" in
                *config.js|*config.mjs|*config.cjs|*config.ts) hit="$hit$f (long-line)"$'\n';;
              esac
            fi
          done < <(git ls-files -- '*config.js' '*config.mjs' '*config.cjs' '*config.ts')
          if [ -n "$hit" ]; then
            echo "PAYLOAD DETECTED in:"; echo "$hit"
            echo "detected=1" >> "$GITHUB_OUTPUT"
            { echo "files<<EOF"; echo "$hit"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "clean"
            echo "detected=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-revert the infected push
        if: steps.scan.outputs.detected == '1'
        shell: bash
        run: |
          set -euo pipefail
          # Revert the branch to its parent (the state before this push) so the
          # payload never survives on the remote. If the parent is also infected,
          # this still removes THIS push; repeated pushes keep getting reverted.
          git config user.name "polinrider-guard"
          git config user.email "guard@users.noreply.github.com"
          parent="${{ github.event.before }}"
          if [ -n "$parent" ] && [ "$parent" != "0000000000000000000000000000000000000000" ]; then
            git push --force origin "$parent:${{ github.ref_name }}" || echo "revert push failed (branch protected?)"
          fi

      - name: Open alert issue
        if: steps.scan.outputs.detected == '1'
        uses: actions/github-script@v7
        env:
          FILES: ${{ steps.scan.outputs.files }}
        with:
          script: |
            const files = process.env.FILES || '';
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `🚨 PolinRider payload blocked on push by ${context.actor}`,
              body: `The PolinRider malware was detected in a push by **${context.actor}** `
                  + `to \`${context.ref}\` (commit ${context.sha.slice(0,8)}) and auto-reverted.\n\n`
                  + `**Infected files:**\n\`\`\`\n${files}\n\`\`\`\n\n`
                  + `**Action required:** ${context.actor}'s machine is infected — disinfect it `
                  + `before pushing again, or every push will keep being reverted.`,
              labels: ['security','polinrider'],
            });

      # Instead of pinging Discord per-repo (a 70-repo burst = 70 pings), record the
      # detection to the central tracking issue and fire the aggregator, which
      # debounces 5 min and sends ONE batched alert + DMs. Uses the cross-repo token.
      - name: Record detection + trigger aggregator
        if: steps.scan.outputs.detected == '1'
        uses: actions/github-script@v7
        env:
          ENFORCER_TOKEN: ${{ secrets.ENFORCER_TOKEN }}
          TRACKING_ISSUE: ${{ secrets.TRACKING_ISSUE }}
        with:
          github-token: ${{ secrets.ENFORCER_TOKEN }}
          script: |
            const org = context.repo.owner;
            const event = {
              repo: context.repo.repo, actor: context.actor,
              sha: context.sha.slice(0,8), ref: context.ref,
              ts: new Date().toISOString(),
            };
            const issue = Number(process.env.TRACKING_ISSUE);
            if (issue) {
              try {
                await github.rest.issues.createComment({
                  owner: org, repo: '.github', issue_number: issue,
                  body: JSON.stringify(event),
                });
              } catch (e) { core.warning('log comment failed: ' + e); }
            }
            try {
              await github.rest.repos.createDispatchEvent({
                owner: org, repo: '.github',
                event_type: 'malware-detected', client_payload: event,
              });
            } catch (e) { core.warning('dispatch failed: ' + e); }

      - name: Fail the run if payload found
        if: steps.scan.outputs.detected == '1'
        run: |
          echo "::error::PolinRider payload detected. push=reverted / PR=blocked. See issue + Discord."
          exit 1
